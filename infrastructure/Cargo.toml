domain.workspace = true
postgres.workspace = true
r2d2.workspace = true
r2d2_postgres.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[lints]
workspace = true
