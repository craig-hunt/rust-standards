# The adapters, and every dependency that reaches outside the process.
#
# The database client, the connection pool, the JSON codec the outbox serializes
# with, and the logging facade all live here. Nothing in the two inner crates
# sees any of them, which is the whole purpose of putting them here, and the
# conventions crate asserts it rather than trusting it.
